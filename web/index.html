  .plate .rim { position:absolute; inset:0; border-radius:50%; border:1px solid var(--line); }

  .slot { aspect-ratio:1/1; border-radius:14px; border:2px dashed var(--line); display:grid; place-items:center; font-size:30px; position:relative; }
  .slot.full { border-style:solid; border-color:transparent; background:var(--soft); animation:pop .35s cubic-bezier(.2,1.4,.4,1); }

  @keyframes pop { from { transform:scale(.5); opacity:0 } to { transform:scale(1); opacity:1 } }

  .card .bud { display:flex; justify-content:center; gap:3px; margin-top:5px; flex-wrap:wrap; }
  .b { display:inline-grid; place-items:center; width:20px; height:20px; border-radius:50%; font-size:9.5px; font-weight:900; border:1.5px solid rgba(0,0,0,.08); }
  .card.sel { transform:translateY(-8px) scale(1.04); border-color:var(--gold); box-shadow:0 8px 20px rgba(224,169,62,.35); }
  .card.hint { border-color:var(--green); } .card.hint::after { content:"✦"; position:absolute; top:-8px; right:-6px; background:var(--green); color:#fff; font-size:11px; border-radius:50%; width:18px; height:18px; display:grid; place-items:center; }
  .card.out { animation:out .35s forwards; } @keyframes out { to { transform:translateY(-40px) scale(.6); opacity:0 } }
  .card.in { animation:inn .35s cubic-bezier(.2,1.2,.4,1); } @keyframes inn { from { transform:translateY(30px) scale(.8); opacity:0 } }
  .row { display:flex; gap:8px; align-items:center; }

  .opts { display:flex; flex-wrap:wrap; gap:7px; margin:4px 0 10px; }

/* ---------- the plate game ---------- */
const HAND = 5, PAIRS_PER_PLATE = 3;
let round = null;
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function newRound(){
  const deck = shuffle(DECK);
  round = { deck, hand: deck.splice(0,HAND), sel:[], plate:[], met:[], spaced:[], foods:[], results:[] };
  ensureMatch();
}
// Every hand holds at least one buddy match, so a young player always has a good move to find.
function handHasMatch(){ for(let i=0;i<round.hand.length;i++) for(let j=i+1;j<round.hand.length;j++) if(wouldBuddy(round.hand[i],round.hand[j])) return true; return false; }
function ensureMatch(){
  if(handHasMatch()) return;
  for(let d=0; d<round.deck.length; d++){ const cand=round.deck[d]; if(round.hand.some(h=>wouldBuddy(cand,h))){ round.deck.splice(d,1); round.deck.push(round.hand[round.hand.length-1]); round.hand[round.hand.length-1]=cand; return; } }
}
function pairsIn(cards){ // every buddy/space rule satisfied by the union of nutrients on these cards
  const ids=[...new Set(cards.flatMap(c=>c.has))]; const out=[];
  for(let i=0;i<ids.length;i++) for(let j=i+1;j<ids.length;j++){ const k=ruleKey(ids[i],ids[j]); if(RULES[k]) out.push(k); }
  return out;
}
function wouldBuddy(card, other){ return pairsIn([card,other]).some(k=>RULES[k].type==="buddy" && !pairsIn([other]).includes(k)); }
function renderPlay(){
  if(!round) newRound();
  const a=avatar||DEFAULT_AV, sel=round.sel;
  const slots = Array.from({length:PAIRS_PER_PLATE*2},(_,i)=>{ const c=round.plate[i]; if(!c) return `<div class="slot"></div>`;
    const pairIdx=Math.floor(i/2), res=round.results[pairIdx]; const tag = i%2===1 && res ? (res.buddy.length?`<span class="pair">${res.buddy.length} 🏅</span>`:res.space.length?`<span class="pair space">space</span>`:"") : "";
    return `<div class="slot full">${c.e}${tag}</div>`; }).join("");
  const sel2 = sel.length===2, tip = sel.length===0 ? "Tap two foods to put them on the plate together." : sel.length===1 ? "Pick a second food. ✦ marks a buddy match." : "Serve it and see who meets!";
  $("#view").innerHTML = `<div class="top"><div class="av">${avatarSVG(a,64)}</div><div><h1>${esc(a.name||"Chef")}'s plate</h1><div class="sub">Pair ${round.plate.length/2+1} of ${PAIRS_PER_PLATE} · ${BUDDY_KEYS.filter(k=>discovered.has(k)).length} of ${BUDDY_KEYS.length} buddy pairs found</div></div></div>
    <div class="plate"><div class="rim"></div><div class="slots">${slots}</div></div>
    <div class="hand">${round.hand.map((c,i)=>`<div class="card ${sel.includes(i)?"sel":""} ${sel.length===1&&!sel.includes(i)&&wouldBuddy(c,round.hand[sel[0]])?"hint":""}" data-i="${i}"><div class="food">${c.e}</div><div class="n">${esc(c.name)}</div><div class="bud">${c.has.map(chip).join("")}</div></div>`).join("")}</div>
    <div class="row"><button class="btn gold block" id="serve" ${sel2?"":"disabled"}>Serve these two</button></div><p class="tip">${tip}</p>`;
  $$(".card").forEach(el=>el.onclick=()=>{ const i=+el.dataset.i; if(sel.includes(i)) round.sel=sel.filter(x=>x!==i); else if(sel.length<2) round.sel=[...sel,i]; else round.sel=[sel[1],i]; renderPlay(); });
  $("#serve").onclick = serve;
}
function serve(){
  const [i,j]=round.sel; const cards=[round.hand[i], round.hand[j]];
  const keys=pairsIn(cards); const buddy=keys.filter(k=>RULES[k].type==="buddy"), space=keys.filter(k=>RULES[k].type==="space");
  const newly = buddy.filter(k=>!discovered.has(k)); buddy.forEach(k=>discovered.add(k)); space.forEach(k=>spaceLearned.add(k));
  round.results = round.results||[]; round.results.push({buddy,space,newly}); round.plate.push(...cards); round.foods.push(...cards.map(c=>c.name));
  round.met.push(...buddy); round.spaced.push(...space);
  // deal replacements
  round.hand = round.hand.filter((_,k)=>k!==i&&k!==j); while(round.hand.length<HAND && round.deck.length) round.hand.push(round.deck.shift()); ensureMatch();
  round.sel=[]; saveAll();
  const unlockedGear = GEAR.filter(g=>newly.includes(g.by) && !gear.has(g.id)); unlockedGear.forEach(g=>gear.add(g.id));
  if(BUDDY_KEYS.every(k=>discovered.has(k)) && !gear.has("crown")){ gear.add("crown"); unlockedGear.push(GEAR.find(g=>g.id==="crown")); }
  saveAll();
  showServe(cards, buddy, space, newly, unlockedGear);
}
function showServe(cards, buddy, space, newly, unlockedGear){
  const title = buddy.length ? (newly.length ? "Best buddies!" : "Buddies again!") : space.length ? "Needs some space!" : "Yummy!";
  const k0 = buddy[0]||space[0]; let meet="", say="";
  if(k0){ const [a,b]=k0.split("_"); const r=RULES[k0]; meet=`<div class="meet"><div class="av">${buddySVG(CH[a],104)}</div><div class="heart">${buddy.length?"💛":"↔️"}</div><div class="av">${buddySVG(CH[b],104)}</div></div>`;
    const single = cards.find(c=>pairsIn([c]).includes(k0));
    say = `${r.kid} ${buddy.length ? (single?`<b>${esc(single.name)}</b> brings both of them by itself — a double helper!`:`<b>${esc(cards[0].name)}</b> brings ${CH[cards[0].has.find(x=>k0.split("_").includes(x))]?.name||""} and <b>${esc(cards[1].name)}</b> brings ${CH[cards[1].has.find(x=>k0.split("_").includes(x)&&x!==cards[0].has.find(y=>k0.split("_").includes(y)))]?.name||"their friend"}.`) : `Still a fine plate; just enjoy these two ${r.timing.toLowerCase()}.`}`; }
  else say = `${cards[0].e} ${esc(cards[0].name)} and ${cards[1].e} ${esc(cards[1].name)} are a tasty pair, but no buddies met this time. Look for the ✦ next round.`;
  const extra = buddy.slice(1).map(k=>{ const [a,b]=k.split("_"); return `<div class="reward" style="background:var(--soft);border-color:var(--line);color:var(--ink)"><span class="big">🤝</span><span>${CH[a].name} + ${CH[b].name} met too: ${RULES[k].verdict}</span></div>`; }).join("");
  const spaced = buddy.length && space.length ? space.slice(0,1).map(k=>{ const [a,b]=k.split("_"); return `<div class="reward" style="background:#F6DCDC;border-color:#E5B3B3;color:#8b2c2c"><span class="big">↔️</span><span>${CH[a].name} and ${CH[b].name} are on this plate too — ${RULES[k].kid}</span></div>`; }).join("") : "";
  const rewards = [...newly.map(k=>{ const [a,b]=k.split("_"); return `<div class="reward"><span class="big">🏅</span><span>New badge: ${CH[a].name} + ${CH[b].name}</span></div>`; }), ...unlockedGear.map(g=>`<div class="reward"><span class="big">${g.icon}</span><span>Unlocked for your chef: ${g.name}. Put it on in the Closet.</span></div>`)].join("");
  if(newly.length) confetti();
  const last = round.plate.length >= PAIRS_PER_PLATE*2;
  sheet(`${meet}<p class="verdict ${buddy.length?"":space.length?"space":""}">${title}</p><p class="say">${say}</p>${extra}${spaced}${rewards}`, [{label: last ? "Finish the plate" : "Next pair", cls:"gold", go: last ? finishPlate : renderPlay}]);
}
function finishPlate(){
  plates.push(...round.foods); saveAll();
  const met=[...new Set(round.met)], unlockedRecipes = RECIPES.filter(r=>met.includes(ruleKey(...r.pair)) && !cooked.has(r.id)).slice(0,2);
  const list = met.length ? met.map(k=>{ const [a,b]=k.split("_"); return `<div class="badge"><span class="big">🏅</span><span>${CH[a].name} + ${CH[b].name}<small>${RULES[k].verdict}</small></span></div>`; }).join("") : `<p class="note">No buddies met on this plate. Watch for the ✦ hint next time: it shows foods whose buddies are friends.</p>`;
  const rec = unlockedRecipes.length ? `<div class="eyebrow">For the grown-ups' cookbook</div>${unlockedRecipes.map(r=>`<div class="recipe"><div class="n">${RECIPE_EMOJI[r.id]||"🍽"} ${esc(r.name)}</div><div class="m">${r.meal} · ${r.prep} min · ${CH[r.pair[0]].name} + ${CH[r.pair[1]].name}</div></div>`).join("")}` : "";
  sheet(`<p class="verdict">Plate complete!</p><p class="say">${round.plate.map(c=>c.e).join(" ")}</p><div class="grid">${list}</div>${rec}`, [{label:"New plate", cls:"gold", go:()=>{ newRound(); renderPlay(); }},{label:"Build my team", cls:"ghost", go:()=>{ newRound(); go("team"); }}]);
}
function confetti(){ const cols=["#E0A93E","#7DB33F","#D75E8A","#4E97DD","#3BB58C"]; for(let i=0;i<40;i++){ const d=document.createElement("i"); d.className="confetti"; d.style.left=Math.random()*100+"vw"; d.style.background=cols[i%cols.length]; d.style.animationDelay=(Math.random()*.4)+"s"; d.style.transform=`rotate(${Math.random()*360}deg)`; document.body.appendChild(d); setTimeout(()=>d.remove(),2200); } }

/* ---------- the team: captain + teammates, built from buddies the child has met ---------- */
const metIds = () => [...new Set(BUDDY_KEYS.filter(k=>discovered.has(k)).flatMap(k=>k.split("_")))];
const clash = (a,b) => { const r=RULES[ruleKey(a,b)]; return r && r.type==="space" ? r : null; };
const teamIds = () => team.captain ? [team.captain, ...team.members] : [];
function setCaptain(id){ team.captain=id; team.members=team.members.filter(m=>m!==id && !clash(id,m)); saveAll(); }
function toggleMember(id){
  if(team.members.includes(id)){ team.members=team.members.filter(m=>m!==id); saveAll(); return null; }
  const c = teamIds().map(t=>clash(t,id)).find(Boolean); if(c) return c;
  if(team.members.length>=3) return { full:true };
  team.members.push(id); saveAll(); return null;
}
// Grocery list from the team: foods carrying the most teammates first, then one good pick per aisle for variety.
const AISLES = [["Produce",["Vegetable","Leafy green","Fruit","Berry","Citrus","Herb","Sea vegetable"]],["Protein & dairy",["Protein","Fish","Meat","Dairy","Legume"]],["Grains, nuts & seeds",["Grain","Nut","Seed"]],["Pantry",["Oil","Dried fruit","Treat","Drink"]]];
function groceryFor(ids){
  if(!ids.length) return [];
  const scored = FOODS.map(f=>({ f, n:f.has.filter(h=>ids.includes(h)).length })).filter(x=>x.n>0).sort((a,b)=>b.n-a.n || a.f.name.localeCompare(b.f.name));
  const pick = [], used = new Set();
  scored.filter(x=>x.n>=2).slice(0,4).forEach(x=>{ pick.push(x); used.add(x.f.name); });
  for(const [aisle, cats] of AISLES){ let got=0; for(const x of scored){ if(got>=2) break; if(used.has(x.f.name) || !cats.includes(x.f.cat)) continue; pick.push(x); used.add(x.f.name); got++; } }
  for(const id of ids){ if(!pick.some(x=>x.f.has.includes(id))){ const x=scored.find(y=>y.f.has.includes(id)&&!used.has(y.f.name)); if(x){ pick.push(x); used.add(x.f.name); } } }
  return pick.map(x=>({ ...x, aisle: (AISLES.find(([,cats])=>cats.includes(x.f.cat))||["Other"])[0], emoji: FOOD_EMOJI[x.f.name]||"" }));
}
function renderTeam(){
  const met = metIds(), cap = team.captain ? CH[team.captain] : null;
  const row = (c, kind) => { const on = kind==="captain" ? team.captain===c.id : team.members.includes(c.id); const blocked = kind==="member" && !on && teamIds().some(t=>clash(t,c.id)); return `<button class="opt ${on?"on":""} ${blocked?"locked":""}" data-${kind}="${c.id}" style="${on?`background:${c.jersey};border-color:${c.jersey};color:#fff`:""}">${c.sym} ${c.name}${blocked?" ↔️":""}</button>`; };
  const roster = teamIds().map(id=>`<div class="badge" style="flex-direction:column;text-align:center;position:relative"><span style="width:64px">${buddySVG(CH[id],64)}</span><span><b>${CH[id].name}</b><small>${id===team.captain?"Captain":CH[id].nutrient}</small></span></div>`).join("");
  const pairsInTeam = BUDDY_KEYS.filter(k=>{ const [a,b]=k.split("_"); return teamIds().includes(a)&&teamIds().includes(b); });
  $("#view").innerHTML = `<div class="top"><div class="av">${avatarSVG(avatar||DEFAULT_AV,64)}</div><div><h1>${esc((avatar||{}).name||"Chef")}'s team</h1><div class="sub">${cap?`Captain ${cap.name} · ${team.members.length} of 3 teammates`:"Pick a captain to start a team"}</div></div></div>
    ${met.length ? `<div class="eyebrow">Captain</div><div class="opts">${met.map(id=>row(CH[id],"captain")).join("")}</div>
    ${cap ? `<div class="eyebrow">Teammates (up to 3)</div><div class="opts">${met.filter(id=>id!==team.captain).map(id=>row(CH[id],"member")).join("")}</div><p class="note" id="teamnote">Best buddies play together. Pairs marked ↔️ need some space from someone already on the team.</p>` : ""}
    ${teamIds().length ? `<div class="eyebrow">This week's team</div><div class="grid" style="grid-template-columns:repeat(${Math.min(4,teamIds().length)},1fr)">${roster}</div>
    ${pairsInTeam.length?`<div class="reward"><span class="big">🤝</span><span>${pairsInTeam.length} best-buddy pair${pairsInTeam.length>1?"s":""} on this team: ${pairsInTeam.map(k=>k.split("_").map(x=>CH[x].name).join(" + ")).join(", ")}</span></div>`:""}
    <p class="note">Your chef wears the captain's jersey, and the grown-ups get a shopping list for this team.</p>` : ""}` : `<div class="recipe"><div class="n">No buddies met yet</div><div class="m">Play a plate and meet some buddies; then you can pick a captain and build a team.</div></div>`}
    <div class="eyebrow" style="margin-top:18px">Badges</div>${badgesHTML()}`;
  $$("[data-captain]").forEach(b=>b.onclick=()=>{ setCaptain(b.dataset.captain===team.captain?null:b.dataset.captain); renderTeam(); });
  $$("[data-member]").forEach(b=>b.onclick=()=>{ const r=toggleMember(b.dataset.member); if(r&&r.full) $("#teamnote").innerHTML=`<b>The team is full.</b> Tap a teammate to take them off first.`; else if(r){ const [a,c]=[CH[r===clash(team.captain,b.dataset.member)?team.captain:teamIds().find(t=>clash(t,b.dataset.member))], CH[b.dataset.member]]; $("#teamnote").innerHTML=`<b>${a.name} and ${c.name} need some space.</b> ${r.kid} Pick one of them for this team.`; } else renderTeam(); });
}
function badgesHTML(){
  const cells = BUDDY_KEYS.map(k=>{ const [a,b]=k.split("_"); const on=discovered.has(k); return `<div class="badge ${on?"":"off"}"><span class="big">${on?"🏅":"🔒"}</span><span>${CH[a].name} + ${CH[b].name}<small>${on?RULES[k].kid:"Find them on a plate"}</small></span></div>`; }).join("");
  const sp = SPACE_KEYS.map(k=>{ const [a,b]=k.split("_"); const on=spaceLearned.has(k); return `<div class="badge ${on?"":"off"}"><span class="big">↔️</span><span>${CH[a].name} + ${CH[b].name}<small>${on?RULES[k].timing:"Not learned yet"}</small></span></div>`; }).join("");
  return `<div class="grid">${cells}</div><div class="eyebrow">Need some space</div><p class="note">Both good for you; they just share a door, so they go in at different meals.</p><div class="grid">${sp}</div>
    <div class="eyebrow">Meet the teams</div><p class="note">Every buddy plays for a team: the team is the vitamin or mineral, the number is its symbol, the name is the player.</p><div class="grid">${CHARACTERS.map(c=>`<div class="badge" style="flex-direction:column;text-align:center"><span style="width:72px">${buddySVG(c,72)}</span><span><b>${c.name}</b> · ${c.nutrient}<small>${c.does}</small></span></div>`).join("")}</div>`;
}
/* ---------- other tabs ---------- */
function renderCloset(){ $("#view").innerHTML = `<div class="top"><div><h1>Closet</h1><div class="sub">Change your chef any time.</div></div></div><div id="maker1"></div>`; maker($("#maker1")); }
function renderGrown(){
  const unlocked = RECIPES.filter(r=>discovered.has(ruleKey(...r.pair))).sort((a,b)=>{ const t=teamIds(); const ia=t.includes(a.pair[0])&&t.includes(a.pair[1]), ib=t.includes(b.pair[0])&&t.includes(b.pair[1]); return (ib?1:0)-(ia?1:0); });
  const shop = [...new Set(plates.slice(-24))];
  const ids = teamIds(), list = groceryFor(ids);
  const byAisle = AISLES.map(([a])=>a).concat(["Other"]).map(a=>({a, items:list.filter(x=>x.aisle===a)})).filter(x=>x.items.length);
  const teamList = ids.length ? `<div class="eyebrow">Shopping list for ${CH[team.captain].name}'s team</div><p class="note">${ids.map(i=>CH[i].name).join(", ")}: foods that bring the most teammates home come first; the rest keep the basket varied. Tap to check off.</p>
    ${byAisle.map(x=>`<div class="eyebrow" style="margin-top:8px;color:var(--ink)">${x.a}</div><div class="shop">${x.items.map(it=>`<span class="${shopDone.has(it.f.name)?"done":""}" data-shop="${esc(it.f.name)}">${it.emoji} ${esc(it.f.name)} <small style="color:var(--muted)">${it.f.has.filter(h=>ids.includes(h)).map(h=>CH[h].sym).join("·")}</small></span>`).join("")}</div>`).join("")}
    <div class="row" style="margin-top:10px"><button class="btn ghost" id="shareList">Share list</button><button class="btn ghost" id="clearDone">Uncheck all</button></div>` : `<div class="eyebrow">Shopping list</div><div class="recipe"><div class="n">No team yet</div><div class="m">When your child picks a captain and teammates on the Team tab, a grocery list for that team appears here.</div></div>`;
  const byMeal = ["Breakfast","Lunch","Dinner","Snack"].map(m=>({m, list:unlocked.filter(r=>r.meal===m)})).filter(x=>x.list.length);
  $("#view").innerHTML = `<div class="top"><div><h1>Grown-ups</h1><div class="sub">What the game unlocked, in a form you can cook from.</div></div></div>
    <p class="note">Each buddy pair your child finds unlocks the recipes built on that pairing. ${unlocked.length} of ${RECIPES.length} recipes are open. Nothing here leaves this device.</p>
    ${teamList}
    <div class="eyebrow" style="margin-top:18px">Cookbook</div>
    ${byMeal.length ? byMeal.map(x=>`<div class="eyebrow">${x.m}</div>${x.list.map(r=>`<div class="recipe"><div class="n">${RECIPE_EMOJI[r.id]||"🍽"} ${esc(r.name)}</div><div class="m">${r.prep} min · serves ${r.serves} · ${CH[r.pair[0]].nutrient} + ${CH[r.pair[1]].nutrient}</div><div class="note" style="margin-top:4px">${esc(r.parent)}</div><details><summary>Ingredients and steps</summary><ul style="padding-left:20px;margin:6px 0 0;font-size:14px">${r.ingredients.map(i=>`<li>${esc(i)}</li>`).join("")}</ul><ol>${r.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol><button class="btn ghost" style="margin-top:8px" data-cook="${r.id}">${cooked.has(r.id)?"Cooked ✓ (cook again)":"We cooked this"}</button></details></div>`).join("")}`).join("") : `<div class="recipe"><div class="n">No recipes yet</div><div class="m">Play a plate together; the first buddy pair opens the first recipes.</div></div>`}
    <div class="eyebrow" style="margin-top:18px">Foods from recent plates</div>${shop.length?`<div class="shop">${shop.map(f=>`<span>${(DECK.find(d=>d.name===f)||{}).e||""} ${esc(f)}</span>`).join("")}</div>`:`<p class="note">Foods from finished plates will collect here.</p>`}
    <div class="eyebrow" style="margin-top:18px">Coming next</div><p class="note">A weekly meal calendar that the unlocked recipes drop into, and a "we cooked it" that lights up the buddies on your child's side.</p>`;
  $$("[data-cook]").forEach(b=>b.onclick=()=>{ cooked.add(b.dataset.cook); saveAll(); confetti(); renderGrown(); });
  $$("[data-shop]").forEach(el=>el.onclick=()=>{ const n=el.dataset.shop; shopDone.has(n)?shopDone.delete(n):shopDone.add(n); saveAll(); renderGrown(); });
  const sl=$("#shareList"); if(sl) sl.onclick=async()=>{ const text=`${CH[team.captain].name}'s team shopping list (Vitamin Village)\n`+byAisle.map(x=>`\n${x.a}\n`+x.items.map(it=>`${shopDone.has(it.f.name)?"☑":"☐"} ${it.f.name}`).join("\n")).join("\n"); try{ if(navigator.share) await navigator.share({ text }); else { await navigator.clipboard.writeText(text); sl.textContent="Copied"; } }catch(e){} };
  const cd=$("#clearDone"); if(cd) cd.onclick=()=>{ shopDone.clear(); saveAll(); renderGrown(); };
}

/* ---------- shell ---------- */
let tab="play";
function go(t){ tab=t; $$(".tabbar button").forEach(b=>b.classList.toggle("on", b.dataset.tab===t)); ({play:renderPlay, team:renderTeam, closet:renderCloset, grown:renderGrown})[t](); window.scrollTo(0,0); }
$$(".tabbar button").forEach(b=>b.onclick=()=>go(b.dataset.tab));
function sheet(html, buttons){ const o=$("#overlay"), s=$("#sheet"); s.innerHTML = html + `<div class="row" style="margin-top:8px">${buttons.map((b,i)=>`<button class="btn ${b.cls||""}" data-i="${i}" style="flex:1">${b.label}</button>`).join("")}</div>`; s.querySelectorAll("[data-i]").forEach(btn=>btn.onclick=()=>{ o.classList.remove("on"); const b=buttons[+btn.dataset.i]; if(b.go) b.go(); }); o.classList.add("on"); }
if(avatar){ $("#start").remove(); go("play"); }
else { maker($("#maker0")); $("#startBtn").onclick=()=>{ if(!avatar) avatar={...DEFAULT_AV}; saveAll(); $("#start").remove(); go("play"); }; }
</script>
</body></html>
