<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Vitamin Buddies</title>
<style>
:root{--ink:#3b2a1a;--paper:#fff6e8;--brick:#e9b9a6;--brick2:#d9a08c;--fog:#c99a86;--cell:#f3e2cf;--cell2:#ecd6bf;--green:#6cc04a;--green2:#4e9a2e;--blue:#4aa8e8;--gold:#f7c948;--card:#fff3dd;--shadow:0 4px 0 rgba(0,0,0,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#1d2a4a;font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--ink);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:linear-gradient(#1b2d5a,#2c4a86 55%,#4a6fb0);padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.top{display:flex;align-items:center;gap:8px;padding:10px 12px 4px}
.star{width:44px;height:44px;border-radius:14px;background:var(--gold);display:grid;place-items:center;font-weight:900;font-size:20px;color:#7a4b00;box-shadow:var(--shadow);position:relative}
.star small{position:absolute;bottom:-14px;left:0;right:0;font-size:9px;color:#fff;text-align:center;font-weight:600}
.pill{flex:1;background:rgba(0,0,0,.35);border-radius:20px;height:34px;display:flex;align-items:center;padding:0 12px 0 10px;color:#fff;font-weight:800;font-size:17px;gap:8px;position:relative}
.pill .ico{font-size:20px}
.pill .sub{position:absolute;right:12px;bottom:-15px;font-size:10px;color:#cfe3ff;font-weight:600}
.counter{display:flex;gap:10px;padding:16px 12px 10px;align-items:flex-end;min-height:118px}
.order{background:var(--card);border-radius:14px;padding:8px;flex:1;max-width:46%;box-shadow:var(--shadow);position:relative;display:flex;gap:8px;align-items:center}
.order .buddy{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:17px;flex:none;border:3px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.order .want{flex:1;text-align:center}
.order .want .em{font-size:30px;line-height:1;display:block;background:#fff;border-radius:10px;padding:4px;position:relative}
.order .want .em b{position:absolute;right:2px;bottom:2px;font-size:10px;background:var(--ink);color:#fff;border-radius:6px;padding:1px 4px}
.order .name{font-size:11px;font-weight:700;margin-top:2px}
.order .coins{position:absolute;top:-10px;right:8px;background:var(--gold);color:#7a4b00;font-size:12px;font-weight:900;border-radius:10px;padding:2px 7px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.order button{position:absolute;left:50%;bottom:-16px;transform:translateX(-50%);background:var(--green);color:#fff;border:0;border-radius:12px;padding:6px 18px;font-weight:900;font-size:15px;box-shadow:0 3px 0 var(--green2);display:none}
.order.can button{display:block}
.order.empty{opacity:.5;justify-content:center;font-size:12px;font-weight:700}
.boardwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px 10px}
#board{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(9,1fr);gap:2px;background:#b37a64;border:4px solid #c9906f;border-radius:14px;padding:6px;height:100%;max-width:100%;aspect-ratio:7/9;touch-action:none;position:relative}
.cell{background:var(--cell);border-radius:6px;position:relative;display:grid;place-items:center;font-size:clamp(20px,7vw,34px);line-height:1}
.cell:nth-child(odd){background:var(--cell2)}
.cell.fog{background:repeating-linear-gradient(0deg,var(--brick) 0 12px,var(--brick2) 12px 14px);}
.cell.fog .lk{position:absolute;top:2px;left:3px;font-size:10px;opacity:.7}
.cell.gen{background:#d7eac9;box-shadow:inset 0 0 0 2px #8bbf6a}
.cell.gen.rest{filter:grayscale(.6)}
.cell .lv{position:absolute;right:2px;bottom:2px;font-size:9px;font-weight:900;background:rgba(59,42,26,.85);color:#fff;border-radius:5px;padding:1px 3px}
.cell .tm{position:absolute;left:0;right:0;bottom:1px;font-size:9px;font-weight:800;text-align:center;color:#2f5a1a}
.cell.sel{outline:3px solid var(--blue);outline-offset:-2px}
.cell.want{box-shadow:inset 0 0 0 3px var(--green)}
.cell.drag{opacity:.25}
.cell .cry{font-size:clamp(16px,5vw,26px)}
#ghost{position:fixed;pointer-events:none;font-size:40px;line-height:1;z-index:50;transform:translate(-50%,-60%);filter:drop-shadow(0 6px 6px rgba(0,0,0,.35));display:none}
.bar{margin:4px 82px 10px 12px;background:var(--card);border-radius:14px;padding:10px 14px;min-height:58px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow)}
.bar .t{flex:1}
.bar .t b{font-size:16px}
.bar .t small{display:block;font-size:12px;opacity:.75;margin-top:2px}
.bar button{background:#fff;border:2px solid #d8c3aa;border-radius:12px;padding:6px 10px;font-weight:800;color:var(--ink);font-size:12px}
.bar button.go{background:var(--green);border-color:var(--green2);color:#fff}
.nav{position:absolute;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:18px;background:var(--blue);border:0;font-size:28px;box-shadow:0 4px 0 #2f7fb8}
#toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);background:rgba(59,42,26,.92);color:#fff;padding:10px 16px;border-radius:14px;font-weight:700;font-size:14px;max-width:86vw;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
#toast.on{opacity:1}
.overlay{position:fixed;inset:0;background:rgba(10,20,50,.72);display:none;place-items:center;z-index:70;text-align:center;color:#fff;padding:24px}
.overlay.on{display:grid}
.overlay h1{font-size:40px;margin:0 0 10px;color:var(--gold);text-shadow:0 3px 0 #a86a00}
.overlay .big{font-size:60px;margin:14px 0}
.overlay p{font-size:17px;margin:6px 0 20px;max-width:30ch}
.overlay button{background:var(--green);border:0;color:#fff;font-size:24px;font-weight:900;padding:12px 40px;border-radius:18px;box-shadow:0 5px 0 var(--green2)}
.bubble{background:#fff;color:var(--ink);border-radius:16px;padding:14px 16px;max-width:34ch;font-size:16px;line-height:1.35;margin:10px auto 22px;position:relative}
.bubble .who{display:block;font-weight:900;font-size:13px;margin-bottom:4px}
.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.fly{position:fixed;z-index:55;font-weight:900;color:var(--gold);font-size:20px;pointer-events:none;animation:fly .9s ease-out forwards;text-shadow:0 2px 0 #7a4b00}
@keyframes fly{to{transform:translateY(-70px);opacity:0}}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="star" id="lvl">1<small id="xp"></small></div>
    <div class="pill"><span class="ico">⚡</span><span id="energy">100</span><span class="sub" id="etimer"></span></div>
    <div class="pill"><span class="ico">🪙</span><span id="coins">0</span></div>
  </div>
  <div class="counter" id="counter"></div>
  <div class="boardwrap"><div id="board"></div></div>
  <div class="bar" id="bar"><div class="t"><b>Vitamin Buddies</b><small>Tap a garden bed or tree to grow something. Drag two of the same together.</small></div></div>
  <button class="nav" id="nav" aria-label="Kitchen">🏠</button>
</div>
<div id="ghost"></div>
<div id="toast"></div>
<div class="overlay" id="levelup"><div><h1>Level Up</h1><div class="big">⭐</div><p id="lvmsg"></p><button id="collect">Collect</button></div></div>
<div class="overlay" id="story"><div><div class="bubble"><span class="who" id="swho"></span><span id="stext"></span></div><button id="sok">Continue</button></div></div>
<script>
/* ---------- data ---------- */
const W=7,H=9,MAXE=100,REGEN_MS=120000,GEN_CHARGES=6,GEN_REST_MS=180000,MAXLV=6;
const CHAINS={
  garden:{name:"Garden",gen:{em:"🪴",name:"Garden bed"},buddy:"ava",
    lv:[["🌰","Seed"],["🌱","Sprout"],["🥕","Carrot"],["📦","Crate of carrots"],["🍢","Carrot sticks"],["🍲","Carrot soup"]]},
  orchard:{name:"Orchard",gen:{em:"🌳",name:"Apple tree"},buddy:"cece",
    lv:[["🌸","Blossom"],["🍏","Green apple"],["🍎","Apple"],["🧺","Basket of apples"],["🍽️","Apple slices"],["🥧","Apple crumble"]]}
};
const BUDDIES={
  ava:{name:"Ava",sym:"A",nutrient:"Vitamin A",bg:"#FDEBD9",ink:"#7A4409",fact:"Carrots carry Ava, and she helps you see well in the dark!",does:"Helps you see well and keeps skin healthy."},
  cece:{name:"Cece",sym:"C",nutrient:"Vitamin C",bg:"#EAF3DE",ink:"#27500A",fact:"Apples carry Cece, who helps cuts heal and fights off sniffles.",does:"Helps cuts heal and fights off sniffles."}
};
const STORY=[
  {who:"Ava",text:"Oh good, the cafe is open again! I'm starving. Could you grow me something orange?"},
  {who:"Cece",text:"Hi! If you grow apples I'll bring my friends. We all get stronger when we eat together."}
];
const need=l=>Math.round(10*Math.pow(1.4,l-1));
const K="vb.save.v1";
/* ---------- state ---------- */
let S=null;
function freshState(){
  const grid=Array(W*H).fill(null).map(()=>({fog:true}));
  const open=(x,y)=>grid[y*W+x]={};
  for(let y=2;y<=6;y++)for(let x=1;x<=5;x++)open(x,y);
  open(0,4);open(6,4);open(3,1);open(3,7);
  grid[3*W+1]={gen:"garden",ch:GEN_CHARGES,rest:0};
  grid[3*W+5]={gen:"orchard",ch:GEN_CHARGES,rest:0};
  const put=(x,y,c,l)=>grid[y*W+x]={c,l};
  put(2,4,"garden",1);put(3,4,"garden",1);put(4,4,"orchard",1);put(2,5,"orchard",1);put(4,5,"garden",2);put(3,6,"orchard",2);
  grid[0*W+0]={fog:true,cry:true};grid[8*W+6]={fog:true,cry:true};
  return {grid,energy:MAXE,tick:Date.now(),coins:0,level:1,exp:0,orders:[null,null],facts:0,story:0,seen:{}};
}
function save(){localStorage.setItem(K,JSON.stringify(S))}
function load(){try{const j=JSON.parse(localStorage.getItem(K));if(j&&j.grid&&j.grid.length===W*H)return j}catch(e){}return null}
S=load()||freshState();
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const idx=(x,y)=>y*W+x;
const nb=i=>{const x=i%W,y=(i-x)/W,o=[];if(x>0)o.push(i-1);if(x<W-1)o.push(i+1);if(y>0)o.push(i-W);if(y<H-1)o.push(i+W);return o};
const isItem=c=>c&&c.c!==undefined;
const itemOf=c=>CHAINS[c.c].lv[c.l-1];
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("on"),1800)}
function fly(el,txt){const r=el.getBoundingClientRect(),d=document.createElement("div");d.className="fly";d.textContent=txt;d.style.left=(r.left+r.width/2-10)+"px";d.style.top=(r.top)+"px";document.body.appendChild(d);setTimeout(()=>d.remove(),900)}
function freeCellNear(i){const seen=new Set([i]),q=[i];while(q.length){const c=q.shift();for(const n of nb(c)){if(seen.has(n))continue;seen.add(n);const g=S.grid[n];if(g.fog||g.gen)continue;if(!isItem(g))return n;q.push(n)}}return -1}
function countOnBoard(c,l){return S.grid.filter(g=>isItem(g)&&g.c===c&&g.l===l).length}
/* ---------- energy ---------- */
function tickEnergy(){const now=Date.now();if(S.energy>=MAXE){S.tick=now;return}const n=Math.floor((now-S.tick)/REGEN_MS);if(n>0){S.energy=Math.min(MAXE,S.energy+n);S.tick+=n*REGEN_MS;if(S.energy>=MAXE)S.tick=now;save()}}
function renderTop(){$("#lvl").firstChild.textContent=S.level;$("#xp").textContent=`${S.exp}/${need(S.level)} xp`;$("#energy").textContent=S.energy;$("#coins").textContent=S.coins;
  const et=$("#etimer");if(S.energy>=MAXE)et.textContent="";else{const ms=REGEN_MS-(Date.now()-S.tick),m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);et.textContent=`${m}:${String(s).padStart(2,"0")}`}}
/* ---------- orders ---------- */
function newOrder(slot){const other=S.orders[1-slot];const chains=Object.keys(CHAINS).filter(k=>!other||other.c!==k);const c=chains[Math.floor(Math.random()*chains.length)]||"garden";
  const lv=Math.min(MAXLV-1,3+Math.floor(Math.random()*Math.min(3,S.level)));const l=Math.max(3,lv);S.orders[slot]={c,l,coins:[0,0,0,4,8,12,20][l],b:CHAINS[c].buddy}}
function ensureOrders(){S.orders.forEach((o,i)=>{if(!o)newOrder(i)})}
function renderOrders(){const el=$("#counter");el.innerHTML="";S.orders.forEach((o,i)=>{const d=document.createElement("div");if(!o){d.className="order empty";d.textContent="…";el.appendChild(d);return}
  const b=BUDDIES[o.b],it=CHAINS[o.c].lv[o.l-1],can=countOnBoard(o.c,o.l)>0;d.className="order"+(can?" can":"");
  d.innerHTML=`<div class="buddy" style="background:${b.bg};color:${b.ink}">${b.sym}</div><div class="want"><span class="em">${it[0]}<b>${o.l}</b></span><div class="name">${b.name} wants ${it[1]}</div></div><div class="coins">+${o.coins} 🪙</div><button data-slot="${i}">Give</button>`;
  el.appendChild(d)})}
function give(slot){const o=S.orders[slot];if(!o)return;const i=S.grid.findIndex(g=>isItem(g)&&g.c===o.c&&g.l===o.l);if(i<0)return;
  S.grid[i]={};S.coins+=o.coins;const btn=document.querySelector(`.order button[data-slot="${slot}"]`);if(btn)fly(btn,`+${o.coins} 🪙`);
  const b=BUDDIES[o.b];if(S.facts<3){S.facts++;toast(`${b.name}: ${b.fact}`)}else toast(`${b.name} says thanks!`);
  addExp(1);S.orders[slot]=null;newOrder(slot);sel=-1;render();save()}
/* ---------- progression ---------- */
function addExp(n){S.exp+=n;if(S.exp>=need(S.level)){S.exp-=need(S.level);S.level++;S.energy=Math.max(S.energy,MAXE)+15;S.tick=Date.now();
  $("#lvmsg").textContent=`Level ${S.level}! Energy refilled, plus 15 extra.`;$("#levelup").classList.add("on");
  const gi=freeCellNear(idx(3,4));if(gi>=0){const c=Math.random()<.5?"garden":"orchard";S.grid[gi]={c,l:3}}}}
$("#collect").onclick=()=>{$("#levelup").classList.remove("on");render();save();if(S.story===1)showStory()};
/* ---------- board ---------- */
let sel=-1;
function render(){renderTop();renderOrders();const bd=$("#board");if(!bd.children.length){for(let i=0;i<W*H;i++){const d=document.createElement("div");d.className="cell";d.dataset.i=i;bd.appendChild(d)}}
  const wants=new Set(S.orders.filter(Boolean).map(o=>o.c+o.l));
  for(let i=0;i<W*H;i++){const g=S.grid[i],d=bd.children[i];d.className="cell";d.innerHTML="";
    if(g.fog){d.classList.add("fog");d.innerHTML=g.cry?`<span class="cry">💎</span><span class="lk">🔒</span>`:`<span class="lk">🔒</span>`;continue}
    if(g.gen){d.classList.add("gen");const G=CHAINS[g.gen].gen;const resting=g.rest>Date.now();if(resting)d.classList.add("rest");d.innerHTML=`${G.em}<span class="lv">${resting?"":g.ch}</span>${resting?`<span class="tm">${fmt(g.rest-Date.now())}</span>`:""}`}
    else if(isItem(g)){const it=itemOf(g);d.innerHTML=`${it[0]}<span class="lv">${g.l}</span>`;if(wants.has(g.c+g.l))d.classList.add("want")}
    if(i===sel)d.classList.add("sel")}
  renderBar()}
const fmt=ms=>{const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);return `${m}:${String(s).padStart(2,"0")}`};
function renderBar(){const bar=$("#bar");const g=sel>=0?S.grid[sel]:null;
  if(!g||(!isItem(g)&&!g.gen)){bar.innerHTML=`<div class="t"><b>Vitamin Buddies</b><small>Tap a garden bed or tree to grow something. Drag two of the same together.</small></div>`;return}
  if(g.gen){const G=CHAINS[g.gen];bar.innerHTML=`<div class="t"><b>${G.gen.name}</b><small>${g.rest>Date.now()?"Resting. Back in "+fmt(g.rest-Date.now()):`Tap to grow a ${G.name.toLowerCase()} item. ${g.ch} left before it rests. Costs 1 ⚡`}</small></div>`;return}
  const it=itemOf(g),ch=CHAINS[g.c];const b=BUDDIES[ch.buddy];
  bar.innerHTML=`<div class="t"><b>${it[1]} <span style="font-weight:600;font-size:12px">(Lv.${g.l}/${MAXLV})</span></b><small>${g.l<MAXLV?"Merge 2 of the same to level up.":"The finished dish!"} Carries ${b.name} (${b.nutrient}).</small></div><button id="sell">Sell 1 🪙</button>`;
  $("#sell").onclick=()=>{S.grid[sel]={};S.coins+=1;sel=-1;render();save()}}
function tapGen(i){const g=S.grid[i];if(g.rest>Date.now()){toast("The "+CHAINS[g.gen].gen.name.toLowerCase()+" is resting");return}
  if(S.energy<=0){toast("Out of energy. It comes back 1 every 2 minutes.");return}
  const f=freeCellNear(i);if(f<0){toast("No room on the board. Merge or sell something.");return}
  if(S.energy>=MAXE)S.tick=Date.now();S.energy--;
  S.grid[f]={c:g.gen,l:Math.random()<.15?2:1};g.ch--;if(g.ch<=0){g.ch=GEN_CHARGES;g.rest=Date.now()+GEN_REST_MS}
  render();const d=$("#board").children[f];d.classList.add("pop");save()}
function clearFogAround(i){for(const n of nb(i)){const g=S.grid[n];if(g.fog){if(g.cry){S.grid[n]={};S.energy+=20;toast("💎 Energy crystal! +20 ⚡")}else S.grid[n]={}}}}
function group(i,c,l){const seen=new Set([i]),q=[i];while(q.length){const x=q.shift();for(const n of nb(x)){if(seen.has(n))continue;const g=S.grid[n];if(isItem(g)&&g.c===c&&g.l===l){seen.add(n);q.push(n)}}}return [...seen]}
function drop(from,to){if(from===to)return;const a=S.grid[from],b=S.grid[to];
  if(b.fog||b.gen){return}
  if(!isItem(b)){S.grid[to]=a;S.grid[from]={};sel=to;render();save();return}
  if(b.c===a.c&&b.l===a.l&&a.l<MAXLV){
    S.grid[to]={c:a.c,l:a.l};S.grid[from]={};
    const grp=group(to,a.c,a.l);
    if(grp.length>=5){const five=grp.slice(0,5);five.forEach(x=>S.grid[x]={});S.grid[to]={c:a.c,l:a.l+1};const f2=freeCellNear(to);if(f2>=0)S.grid[f2]={c:a.c,l:a.l+1};toast("5 merged: two for the price of one!")}
    else S.grid[to]={c:a.c,l:a.l+1};
    clearFogAround(to);addExp(0);sel=to;render();$("#board").children[to].classList.add("pop");
    if(S.grid[to].l===MAXLV&&!S.seen[a.c]){S.seen[a.c]=1;toast(`You made ${CHAINS[a.c].lv[MAXLV-1][1]}!`)}
    save();return}
  toast(a.l===MAXLV?"That's already the finished dish.":"Those don't match.");render()}
/* ---------- pointer handling ---------- */
const ghost=$("#ghost");let drag=null;
const bd=$("#board");
bd.addEventListener("pointerdown",e=>{const cell=e.target.closest(".cell");if(!cell)return;const i=+cell.dataset.i,g=S.grid[i];drag={i,x:e.clientX,y:e.clientY,moved:false,item:isItem(g)};bd.setPointerCapture(e.pointerId)});
bd.addEventListener("pointermove",e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(!drag.moved&&Math.hypot(dx,dy)>8&&drag.item){drag.moved=true;ghost.textContent=itemOf(S.grid[drag.i])[0];ghost.style.display="block";bd.children[drag.i].classList.add("drag")}
  if(drag.moved){ghost.style.left=e.clientX+"px";ghost.style.top=e.clientY+"px"}});
function endDrag(e){if(!drag)return;const d=drag;drag=null;ghost.style.display="none";bd.children[d.i].classList.remove("drag");
  if(d.moved){ghost.style.display="none";const el=document.elementFromPoint(e.clientX,e.clientY),cell=el&&el.closest(".cell");if(cell)drop(d.i,+cell.dataset.i);else render();return}
  const g=S.grid[d.i];if(g.gen){sel=d.i;tapGen(d.i)}else if(isItem(g)){sel=d.i;render()}else if(g.fog){sel=-1;render();toast(g.cry?"Merge next to it to crack the crystal.":"Merge something next to this to clear it.")}else{sel=-1;render()}}
bd.addEventListener("pointerup",endDrag);bd.addEventListener("pointercancel",endDrag);
$("#counter").addEventListener("click",e=>{const b=e.target.closest("button[data-slot]");if(b)give(+b.dataset.slot)});
$("#nav").onclick=()=>toast("The Kitchen opens in the next build.");
/* ---------- story ---------- */
function showStory(){if(S.story>=STORY.length)return;const s=STORY[S.story];$("#swho").textContent=s.who;$("#stext").textContent=s.text;$("#story").classList.add("on")}
$("#sok").onclick=()=>{S.story++;$("#story").classList.remove("on");save();if(S.story===1&&S.level<2){}};
/* ---------- boot ---------- */
tickEnergy();ensureOrders();render();save();
if(S.story===0)showStory();
setInterval(()=>{tickEnergy();renderTop();if(!drag&&S.grid.some(g=>g.gen&&g.rest>Date.now()-1500))render();},1000);
window.addEventListener("keydown",e=>{if(e.key==="R"&&e.shiftKey&&e.altKey){localStorage.removeItem(K);location.reload()}});
</script>
</body>
</html>
